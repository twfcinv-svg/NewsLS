<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資情報快篩 V15</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f4f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 22px; color: #000; }
        .controls { display: flex; gap: 10px; align-items: center; }
        .btn-pdf { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .update-time { color: #d32f2f; font-weight: bold; font-size: 14px; margin-right: 15px; }
        
        .section-main { margin-top: 30px; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; }
        .section-title { padding: 10px 15px; font-weight: bold; color: white; font-size: 1.1em; display: flex; justify-content: space-between; }
        
        /* 專區色彩設定 */
        .etf-title { background: #007A87; } 
        .bull-title { background: #c62828; }
        .bear-title { background: #2e7d32; }
        
        .sub-section { padding: 0; }
        .sub-title { background: #f0f0f0; color: #333; padding: 6px 15px; font-weight: bold; font-size: 0.95em; border-bottom: 1px solid #ddd; border-top: 1px solid #ddd; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 8px; background: #fafafa; color: #666; font-size: 0.85em; border-bottom: 1px solid #eee; }
        td { padding: 6px; }
        
        .row-etf { border-bottom: 1px solid #eee; background-color: #f0f7f8; }
        .row-bull { border-bottom: 1px solid #eee; background-color: #fff5f5; }
        .row-bear { border-bottom: 1px solid #eee; background-color: #f1f8e9; }
        
        .col-id { color: #666; font-size: 0.8em; text-align: center; width: 30px; }
        .col-source { color: #888; font-size: 0.85em; width: 80px; }
        .col-title a { text-decoration: none; color: #333; font-weight: 500; display: block; line-height: 1.4; font-size: 14px; }
        .col-score { text-align: right; width: 50px; font-family: monospace; font-weight: bold; font-size: 1.1em; }
        
        .score-bull { color: #b71c1c; }
        .score-bear { color: #1b5e20; }
        
        @media print {
            .btn-pdf { display: none; }
            body { padding: 0; background: #fff; }
            .container { max-width: 100%; box-shadow: none; }
            .section-main { page-break-inside: avoid; margin-top: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 投資情報快篩</h1>
            <div class="controls">
                <span class="update-time" id="updateTime">更新：資料讀取中...</span>
                <button class="btn-pdf" onclick="window.print()">🖨️ PDF</button>
            </div>
        </header>
        
        <div style="text-align: left; font-weight: bold; color: #555; margin-bottom: 5px;">☁️ 市場熱詞 (Hot Keywords)</div>
        <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; line-height: 1.8; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;">
            <span style="font-size: 2.50em; color: #1976d2; margin: 5px 10px; opacity: 0.9;">台股 <sup style="font-size:0.5em; color:#ccc;">30</sup></span><span style="font-size: 1.70em; color: #d32f2f; margin: 5px 10px; opacity: 0.9;">AI <sup style="font-size:0.5em; color:#ccc;">14</sup></span><span style="font-size: 1.50em; color: #7b1fa2; margin: 5px 10px; opacity: 0.9;">台積 <sup style="font-size:0.5em; color:#ccc;">10</sup></span><span style="font-size: 1.50em; color: #1976d2; margin: 5px 10px; opacity: 0.9;">外資 <sup style="font-size:0.5em; color:#ccc;">10</sup></span>
            <span style="font-size: 1.35em; color: #388e3c; margin: 5px 10px; opacity: 0.9;">ETF <sup style="font-size:0.5em; color:#ccc;">8</sup></span><span style="font-size: 1.25em; color: #d32f2f; margin: 5px 10px; opacity: 0.9;">布局 <sup style="font-size:0.5em; color:#ccc;">5</sup></span><span style="font-size: 1.20em; color: #7b1fa2; margin: 5px 10px; opacity: 0.9;">聯發科 <sup style="font-size:0.5em; color:#ccc;">4</sup></span>
        </div>
        
        <div style="background:#f8f9fa; padding:8px; text-align:center; font-size:0.9em; border-radius:4px; margin-bottom:20px; color:#555;">
            母體掃描: 動態監控中 | 資料來源含 Yahoo, 鉅亨, 經濟, 工商, PTT
        </div>

        <div class="section-main">
            <div class="section-title etf-title">
                <span>📈 ETF 專區 (ETF Watchlist)</span>
                <span id="etfCount">共 0 筆</span>
            </div>
            <div class="sub-section">
                <table>
                    <thead>
                        <tr>
                            <th style="text-align:center; width: 30px;">#</th>
                            <th style="width: 80px;">來源</th>
                            <th>新聞標題</th>
                            <th style="text-align:right; width: 50px;">分數</th>
                        </tr>
                    </thead>
                    <tbody id="etfTableBody">
                        </tbody>
                </table>
            </div>
        </div>

        <div style="text-align: center; color: #ccc; font-size: 11px; margin-top: 30px;">
            Generated by GitHub Actions | V15 Dynamic Dashboard
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            document.getElementById('updateTime').innerText = `更新：${now.toLocaleString('zh-TW')}`;

            // 發送請求讀取同資料夾下的 etf_news_history.json
            fetch('etf_news_history.json')
                .then(response => {
                    if (!response.ok) throw new Error('網路回應不成功');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('etfCount').innerText = `共 ${data.length} 筆 (最新儲存)`;
                    const tbody = document.getElementById('etfTableBody');
                    tbody.innerHTML = ''; // 清空預設內容
                    
                    data.forEach((item, index) => {
                        let scoreColorClass = item.score > 0 ? 'score-bull' : 'score-bear';
                        let scoreText = item.score > 0 ? `+${item.score}` : item.score;

                        let tr = document.createElement('tr');
                        tr.className = 'row-etf';
                        tr.innerHTML = `
                            <td class="col-id">${index + 1}</td>
                            <td class="col-source">${item.source}</td>
                            <td class="col-title"><a href="${item.url}" target="_blank">${item.title}</a></td>
                            <td class="col-score ${scoreColorClass}">${scoreText}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error('無法載入 JSON 資料:', error);
                    document.getElementById('etfTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999; padding:20px;">⚠️ 尚未產生 ETF 歷史資料檔案，請等待機器人執行爬蟲。</td></tr>';
                });
        });
    </script>
</body>
</html>
